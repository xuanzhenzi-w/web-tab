<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="archive.css" />
</head>
<body>
  <div class="wrap">
    <div class="top-card">
      <div class="header">
        <div class="title" data-i18n="arch_title">归档记录</div>
        <div class="header-right">
          <span class="sub" id="count">加载中…</span>
          <button id="statsBtn" data-i18n="stats_title" data-i18n-title="stats_title">统计</button>
          <button id="openOptionsBtn" data-i18n="btn_options" data-i18n-title="btn_options_title">设置</button>
          <button id="refreshBtn" data-i18n="arch_refresh" data-i18n-title="arch_refresh_title">刷新</button>
        </div>
      </div>
      <div class="search-bar">
        <input type="text" id="searchInput" data-i18n-ph="arch_search_ph" placeholder="搜索标题或网址，多个关键词空格分隔" />
        <label class="regex-toggle" data-i18n-title="arch_regex_title" title="开启后将搜索内容视为 JavaScript 正则表达式">
          <input type="checkbox" id="regexToggle" />
          <span data-i18n="arch_regex">正则</span>
        </label>
      </div>
      <div class="search-error" id="searchError"></div>
      <div class="frequent" id="frequentPanel" hidden>
        <button type="button" class="frequent-head" id="frequentToggle" aria-expanded="true">
          <svg class="frequent-chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 9l6 6 6-6" />
          </svg>
          <span class="frequent-title" data-i18n="frequent_title">最常访问</span>
          <span class="frequent-sub" id="frequentSub"></span>
        </button>
        <div class="frequent-chips" id="frequentChips"></div>
      </div>

      <div class="donate-bar">
        <span class="donate-prompt" data-i18n="donate_prompt">喜欢标签管家？</span>
        <span class="donate-link" id="afdianLink" data-i18n="support_afdian">爱发电</span>
      </div>
    </div>

    <ul id="archiveList" class="archive-list"></ul>
  </div>

  <div id="toast" class="toast"></div>

  <script src="i18n.js"></script>
  <script src="archive.js"></script>
</body>
</html>
